### model
model_name_or_path: ./models/Qwen3-30B-A3B-Base
trust_remote_code: true
use_reentrant_gc: false

### method — weight-OFT: canonical OFT (block-diagonal orthogonal, exact Cayley)
# block_size controls capacity; out*(b-1)/2 per matrix. block=8 -> ~78M, no rank=1.
stage: sft
do_train: true
finetuning_type: weight_peft
weight_peft_type: oft
weight_peft_oft_block_size: 8
weight_peft_attach_attn: true
weight_peft_attach_ffn: true
weight_peft_attn_targets: auto

### dataset
dataset: metamathqa_r1
template: qwen3
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/peft_compare/weight_oft
logging_steps: 5
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none
run_name: weight_oft_math_base

### train
per_device_train_batch_size: 12
gradient_accumulation_steps: 3
learning_rate: 6.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z2_config.json
