### model
model_name_or_path: ./models/Qwen3-30B-A3B-Base
trust_remote_code: true
use_reentrant_gc: false

### method — DAS-LoRA (selective): LoRA only on the DAS-selected top-k experts per layer.
# Selection JSON is produced by eval_scripts/compute_das.py (domain=metamathqa vs general).
# trainable = sum_layers(n_selected * 4096 * rank); top_k=8, rank=48 -> ~75.5M (~0.25% of 30B).
# This is the "selective" paradigm (expert subset), so it does NOT add attention adapters.
stage: sft
do_train: true
finetuning_type: das_lora
das_lora_selected_experts_path: eval_results/das_metamath_qwen3.json
das_lora_rank: 48
das_lora_alpha: 96

### dataset
dataset: metamathqa_r1
template: qwen3
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/peft_compare/das_lora
logging_steps: 5
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none
run_name: das_lora_math_base

### train
per_device_train_batch_size: 12
gradient_accumulation_steps: 3
learning_rate: 6.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z2_config.json
