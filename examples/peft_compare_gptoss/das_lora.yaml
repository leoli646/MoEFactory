### model — openai/gpt-oss-20b (mxfp4 权重, llamafactory 自动 Mxfp4Config(dequantize=True) 反量化为 bf16)
# 24 层全 MoE | E=32 top_k=4 | d=2880 inter=2880 | vocab 201k
model_name_or_path: ./models/gpt-oss-20b
trust_remote_code: true
use_reentrant_gc: false

### method — DAS-LoRA (selective): LoRA only on DAS-selected top-k experts per layer (无 attn adapter)
# 24 层 x top4 x 2 x r96 x 2880 = 53.1M (= expert_lora; DAS top_k=4 对齐模型 top_k); selection json 由 run_peft_compare_nm.sh 的 ensure_das 现算/复用并覆盖此路径
stage: sft
do_train: true
finetuning_type: das_lora
das_lora_selected_experts_path: eval_results/das_metamath_gptoss.json
das_lora_rank: 96
das_lora_alpha: 192
### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/peft_compare_nm/gptoss/math/das_lora
logging_steps: 5
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none
run_name: das_lora_gptoss_math

### train (2026-07-12: eager attention 下 PBS12 在 math/cutoff2048 擦线 OOM, 收敛为 6x6; 有效 batch 恒=144)
per_device_train_batch_size: 6
gradient_accumulation_steps: 6
learning_rate: 6.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed (frozen base -> ZeRO-2, 不做参数切分)
deepspeed: examples/deepspeed/ds_z2_config.json
