### model — openai/gpt-oss-20b (mxfp4 权重, llamafactory 自动 Mxfp4Config(dequantize=True) 反量化为 bf16)
# 24 层全 MoE | E=32 top_k=4 | d=2880 inter=2880 | vocab 201k
model_name_or_path: ./models/gpt-oss-20b
trust_remote_code: true
use_reentrant_gc: false

### method — weight-FourierFT: DFT spectral delta on expert weights (gate_up+down) + attn q/k/v/o
# n_freq=30000 x 1632 矩阵 ≈ 49.0M; per-expert iDFT 计算最重, 冒烟盯 step time
stage: sft
do_train: true
finetuning_type: weight_peft
weight_peft_type: fourier
weight_peft_fourier_n_frequencies: 30000
weight_peft_fourier_scaling: 150.0
weight_peft_fourier_seed: 2024
weight_peft_attach_attn: true
weight_peft_attach_ffn: true
weight_peft_attn_targets: auto
### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/peft_compare_nm/gptoss/math/weight_fourier
logging_steps: 5
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none
run_name: weight_fourier_gptoss_math

### train (2026-07-12: eager attention 下 PBS12 在 math/cutoff2048 擦线 OOM, 收敛为 6x6; 有效 batch 恒=144)
per_device_train_batch_size: 6
gradient_accumulation_steps: 6
learning_rate: 6.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed (frozen base -> ZeRO-2, 不做参数切分)
deepspeed: examples/deepspeed/ds_z2_config.json
