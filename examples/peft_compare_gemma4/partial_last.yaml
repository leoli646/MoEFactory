### model — google/gemma-4-26B-A4B (base, 多模态壳 Gemma4ForConditionalGeneration)
# 30 层全 MoE | E=128 top_k=8 | d=2816 moe_inter=704 | vocab 262k
model_name_or_path: ./models/gemma-4-26B-A4B
trust_remote_code: true
use_reentrant_gc: false

### method — partial fine-tuning: full attn+expert weights of ONE decoder layer (last, idx 29 of 30)
# 单层 128 experts(gate_up+down) 0.76B + attn 30M ≈ 0.79B (范式固有,更大; ZeRO-2)
stage: sft
do_train: true
finetuning_type: partial_ft
partial_ft_target: last
partial_ft_modules: attn,expert
### dataset
dataset: metamathqa_r1
template: default
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/peft_compare_nm/gemma4/math/partial_last
logging_steps: 5
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none
run_name: partial_last_gemma4_math

### train
per_device_train_batch_size: 6
gradient_accumulation_steps: 6
learning_rate: 6.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed (frozen base -> ZeRO-2, 不做参数切分)
deepspeed: examples/deepspeed/ds_z2_config.json
