### model — openai/gpt-oss-20b (mxfp4 权重, llamafactory 自动 Mxfp4Config(dequantize=True) 反量化为 bf16)
# 24 层全 MoE | E=32 top_k=4 | d=2880 inter=2880 | vocab 201k
model_name_or_path: ./models/gpt-oss-20b
trust_remote_code: true
use_reentrant_gc: false

### method (baseline1: follow_moe — 路由直接复用 GPT-OSS 原 router; position ablation 的 FFN 分支基座)
# trainable = 24 层 × 32 experts × 2(A,B) × rank × 2880
#   rank=8 → 35.4M (≈0.17% of 20B) — 与 qwen3 baseline1(rank=2, 50M, 0.168%) 同比例
# attn / router 位置的 LoRA 由 run_pos_ab_nm.sh 以覆盖参数追加(ATTN_RANK/ROUTER_RANK, 默认 8/16)。
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 32                   # 必须 = GPT-OSS num_local_experts
moe_lora_rank: 8
moe_lora_alpha: 16
moe_lora_top_k: 4                        # = GPT-OSS num_experts_per_tok
moe_lora_pool_share: per_layer
moe_lora_w_share: per_layer
moe_lora_routing_mode: follow_moe
moe_lora_target_layers: all

### dataset (跨模型协议与 pos_ab 的 OLMoE/DeepSeek 一致: template=default; intent 由 runner 覆盖)
dataset: metamathqa_r1
template: default
cutoff_len: 2048
max_samples: 80000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/pos_ab_nm/math/gptoss_ffn_ep1
logging_steps: 5
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none
run_name: gptoss_baseline1_math

### train (2026-07-12: eager attention 下 PBS12 擦线 OOM, 收敛为 6x6; 有效 batch 恒=144)
per_device_train_batch_size: 6
gradient_accumulation_steps: 6
learning_rate: 6.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: true

### deepspeed
deepspeed: examples/deepspeed/ds_z2_config.json
